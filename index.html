<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gedaa Restaurant — Digital QR Menu</title>
  
  <!-- Favicon with Oromo Gedaa Symbol -->
  <link rel="icon" type="image/svg+xml" href="gedaa_logo.svg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              DEFAULT: '#0c3627',
              light: '#134e38',
              dark: '#08251a',
              subtle: '#eaf4ee'
            },
            cream: {
              DEFAULT: '#faf7f2',
              card: '#ffffff',
              border: '#ede8e1'
            },
            gold: '#d4a373'
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-100 min-h-screen text-stone-900 pb-12 selection:bg-emerald-200">

  <!-- Main Customer Mobile-First Frame -->
  <main id="app-root" class="min-h-screen">
    <!-- Rendered dynamically by JavaScript -->
  </main>

  <!-- Application Logic & Sanitizer -->
  <script src="app.js"></script>

  <!-- View Rendering Script -->
  <script>
    function renderApp() {
      const root = document.getElementById("app-root");
      const state = window.appState;
      const cartCount = getCartCount();

      root.innerHTML = `
        <div class="mobile-frame-container border-x border-stone-200">
          
          <!-- Top App Header with Oromo Gadaa Logo -->
          <div class="bg-forest text-white px-4 pt-4 pb-3 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <!-- Gedaa Restaurant Brand & Oromo Gadaa Symbol -->
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl overflow-hidden bg-white p-0.5 border-2 border-amber-400 shadow-md flex-shrink-0">
                  <img src="gedaa_logo.svg" alt="Oromo Gadaa Symbol" class="w-full h-full object-contain">
                </div>
                <div>
                  <h1 class="font-black text-lg leading-tight text-white tracking-tight">${escapeHtml(t("restaurantName"))}</h1>
                  <p class="text-emerald-200 text-xs font-medium">${escapeHtml(t("restaurantSubtitle"))}</p>
                </div>
              </div>

              <!-- Top Actions: Language Pill (EN | ORO | አማ) + Cart -->
              <div class="flex items-center gap-2">
                <div class="flex items-center bg-forest-dark border border-emerald-800/80 rounded-full p-1 text-[10px] font-extrabold">
                  <button onclick="setLanguage('en')" class="px-2 py-0.5 rounded-full ${state.lang === 'en' ? 'bg-emerald-600 text-white' : 'text-emerald-300'}">EN</button>
                  <button onclick="setLanguage('om')" class="px-2 py-0.5 rounded-full ${state.lang === 'om' ? 'bg-emerald-600 text-white' : 'text-emerald-300'}">ORO</button>
                  <button onclick="setLanguage('am')" class="px-2 py-0.5 rounded-full ${state.lang === 'am' ? 'bg-emerald-600 text-white' : 'text-emerald-300'}">አማ</button>
                </div>
                <button onclick="switchTab('order')" class="relative p-2 rounded-xl bg-forest-dark/80 text-emerald-200 hover:text-white border border-emerald-800">
                  <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                  ${cartCount > 0 ? `<span class="absolute -top-1 -right-1 bg-amber-400 text-stone-900 font-extrabold text-[10px] w-4 h-4 rounded-full flex items-center justify-center">${cartCount}</span>` : ''}
                </button>
              </div>
            </div>

            <!-- Explore Menu Banner / Dropdown Pill -->
            <div class="flex items-center justify-between bg-forest-light/60 rounded-xl px-3 py-1.5 text-xs text-emerald-100 mb-3">
              <span class="flex items-center gap-1.5 font-medium">
                <i data-lucide="utensils" class="w-3.5 h-3.5 text-amber-300"></i>
                ${escapeHtml(t("exploreMenu"))}
              </span>
              <span class="text-[11px] bg-emerald-800/80 px-2 py-0.5 rounded-full font-semibold text-emerald-200">
                ${state.lang === 'am' ? 'ጠረጴዛ' : state.lang === 'om' ? 'Minjaala' : 'Table'} ${escapeHtml(state.tableNumber)}
              </span>
            </div>

            <!-- Instant Search Bar -->
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
              <input type="text" 
                value="${escapeHtml(state.searchQuery)}" 
                oninput="window.appState.searchQuery = this.value; renderApp();"
                placeholder="${escapeHtml(t("searchPlaceholder"))}" 
                class="w-full bg-white text-stone-800 pl-9 pr-4 py-2.5 rounded-xl text-xs placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 shadow-sm font-medium">
            </div>
          </div>

          <!-- Main Content Tab Area -->
          <div class="p-4 pb-28">
            ${
              state.currentTab === "menu" ? renderMenuTabContent() :
              state.currentTab === "order" ? renderOrderTabContent() :
              state.currentTab === "offers" ? renderOffersTabContent() :
              renderMoreTabContent()
            }
          </div>

          <!-- Floating "Call Waiter" Button -->
          <div class="fixed bottom-20 right-4 z-30 max-w-[440px] pointer-events-none">
            <button id="callWaiterBtn" onclick="triggerCallWaiter()" 
              class="pointer-events-auto bg-forest hover:bg-forest-dark text-white px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 text-xs font-bold border-2 border-emerald-500/30 transition-transform active:scale-95">
              <i data-lucide="phone-call" class="w-4 h-4 text-emerald-300"></i>
              <span>${escapeHtml(t("callWaiter"))}</span>
            </button>
          </div>

          <!-- Fixed Bottom Navigation Bar -->
          <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-stone-200 shadow-lg">
            <div class="max-w-[440px] mx-auto flex items-center justify-around py-2">
              <button onclick="switchTab('menu')" class="flex flex-col items-center gap-1 py-1 px-3 ${state.currentTab === 'menu' ? 'text-forest font-bold' : 'text-stone-400 font-medium'}">
                <i data-lucide="book-open" class="w-5 h-5"></i>
                <span class="text-[11px]">${escapeHtml(t("menu"))}</span>
              </button>

              <button onclick="switchTab('order')" class="relative flex flex-col items-center gap-1 py-1 px-3 ${state.currentTab === 'order' ? 'text-forest font-bold' : 'text-stone-400 font-medium'}">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                ${cartCount > 0 ? `<span class="absolute top-0 right-2 bg-emerald-600 text-white font-bold text-[10px] w-4 h-4 rounded-full flex items-center justify-center">${cartCount}</span>` : ''}
                <span class="text-[11px]">${escapeHtml(t("order"))}</span>
              </button>

              <button onclick="switchTab('offers')" class="flex flex-col items-center gap-1 py-1 px-3 ${state.currentTab === 'offers' ? 'text-forest font-bold' : 'text-stone-400 font-medium'}">
                <i data-lucide="tag" class="w-5 h-5"></i>
                <span class="text-[11px]">${escapeHtml(t("offers"))}</span>
              </button>

              <button onclick="switchTab('more')" class="flex flex-col items-center gap-1 py-1 px-3 ${state.currentTab === 'more' ? 'text-forest font-bold' : 'text-stone-400 font-medium'}">
                <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                <span class="text-[11px]">${escapeHtml(t("more"))}</span>
              </button>
            </div>
          </nav>
        </div>
      `;

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // TAB 1: MENU ITEMS & CATEGORIES (With XSS Sanitization)
    function renderMenuTabContent() {
      const state = window.appState;
      let dishes = state.dishes || [];

      if (state.selectedCategory !== "all") {
        dishes = dishes.filter(item => item.category === state.selectedCategory);
      }
      if (state.searchQuery.trim() !== "") {
        const q = state.searchQuery.toLowerCase();
        dishes = dishes.filter(item => {
          const tEn = (item.title_en || item.titleEn || '').toLowerCase();
          const tAm = (item.title_am || item.titleAm || '');
          const dEn = (item.desc_en || item.descEn || '').toLowerCase();
          const dAm = (item.desc_am || item.descAm || '');
          return tEn.includes(q) || tAm.includes(q) || dEn.includes(q) || dAm.includes(q);
        });
      }

      return `
        <!-- Categories Horizontal Scroll -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 pb-3 mb-3 pt-1">
          ${CATEGORIES.map(cat => {
            const isSelected = state.selectedCategory === cat.id;
            const catName = state.lang === 'am' ? cat.nameAm : (state.lang === 'om' ? (cat.nameOm || cat.nameEn) : cat.nameEn);
            const safeCatId = escapeHtml(cat.id);
            return `
              <button onclick="setCategory('${safeCatId}')" 
                class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all flex-shrink-0 ${
                  isSelected 
                    ? 'bg-forest text-white shadow-sm ring-1 ring-forest' 
                    : 'bg-white text-stone-600 border border-stone-200/90 hover:bg-stone-50'
                }">
                <i data-lucide="${escapeHtml(cat.icon)}" class="w-3.5 h-3.5"></i>
                <span>${escapeHtml(catName)}</span>
              </button>
            `;
          }).join("")}
        </div>

        <!-- Featured Section Header -->
        ${state.selectedCategory === 'all' && !state.searchQuery ? `
          <div class="flex items-center justify-between mb-3 mt-1">
            <h2 class="text-sm font-extrabold text-stone-800 tracking-tight flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              ${escapeHtml(t("featured"))}
            </h2>
            <span class="text-[11px] text-stone-400 font-medium">${dishes.length} items</span>
          </div>
        ` : ''}

        <!-- Dish Cards List -->
        <div class="space-y-3.5">
          ${dishes.map(item => {
            const qty = state.cart[item.id] || 0;
            const title = getItemTranslation(item, "title");
            const desc = getItemTranslation(item, "desc");
            const isSoldOut = item.is_available === false || item.is_available === 0;
            const safeId = escapeHtml(item.id);
            const safeTitle = escapeHtml(title);
            const safeDesc = escapeHtml(desc);
            const safeImage = sanitizeUrl(item.image);

            return `
              <div class="bg-white rounded-2xl p-3.5 border border-stone-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex gap-3.5 items-start ${isSoldOut ? 'opacity-60 grayscale' : ''}">
                <div class="relative w-24 h-24 flex-shrink-0 rounded-xl overflow-hidden bg-stone-100 border border-stone-100">
                  <img src="${safeImage}" alt="${safeTitle}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80';" class="w-full h-full object-cover">
                  ${isSoldOut ? `<span class="absolute inset-0 bg-black/60 text-white font-bold text-[10px] flex items-center justify-center">${escapeHtml(t("soldOut"))}</span>` : ''}
                </div>

                <div class="flex-1 min-w-0">
                  <div class="flex flex-wrap gap-1 mb-1">
                    ${(item.badges || []).map(b => {
                      if (b === 'spicy') return `<span class="badge-spicy text-[10px] font-bold px-1.5 py-0.5 rounded-md">🌶️ Spicy</span>`;
                      if (b === 'gluten') return `<span class="badge-gluten text-[10px] font-bold px-1.5 py-0.5 rounded-md">🌾 Gluten</span>`;
                      if (b === 'fasting') return `<span class="badge-fasting text-[10px] font-bold px-1.5 py-0.5 rounded-md">🌱 Fasting</span>`;
                      if (b === 'dairy') return `<span class="badge-dairy text-[10px] font-bold px-1.5 py-0.5 rounded-md">🥛 Dairy</span>`;
                      if (b === 'popular') return `<span class="badge-popular text-[10px] font-bold px-1.5 py-0.5 rounded-md">⭐ Popular</span>`;
                      if (b === 'eggs') return `<span class="badge-eggs text-[10px] font-bold px-1.5 py-0.5 rounded-md">🥚 Eggs</span>`;
                      return '';
                    }).join("")}
                  </div>

                  <h3 class="font-bold text-stone-900 text-sm leading-snug line-clamp-1 mb-0.5">${safeTitle}</h3>
                  <p class="text-[11px] text-stone-500 line-clamp-2 leading-relaxed mb-2.5 font-normal">${safeDesc}</p>

                  <div class="flex items-center justify-between mt-auto pt-1 border-t border-stone-100">
                    <span class="font-extrabold text-stone-900 text-sm">
                      ${Number(item.price).toLocaleString()} <span class="text-[11px] font-medium text-stone-500">${escapeHtml(t("currency"))}</span>
                    </span>

                    ${
                      isSoldOut ? `
                        <span class="text-[11px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-lg border border-rose-200">${escapeHtml(t("soldOut"))}</span>
                      ` : qty > 0 ? `
                        <div class="flex items-center bg-stone-100 rounded-lg p-0.5 border border-stone-200">
                          <button onclick="removeFromCart('${safeId}')" class="w-6 h-6 flex items-center justify-center rounded-md bg-white text-stone-800 shadow-xs font-bold text-xs hover:bg-stone-50">-</button>
                          <span class="w-6 text-center text-xs font-extrabold text-stone-900">${qty}</span>
                          <button onclick="addToCart('${safeId}')" class="w-6 h-6 flex items-center justify-center rounded-md bg-forest text-white shadow-xs font-bold text-xs hover:bg-forest-dark">+</button>
                        </div>
                      ` : `
                        <button onclick="addToCart('${safeId}')" 
                          class="w-8 h-8 rounded-xl bg-forest hover:bg-forest-dark text-white flex items-center justify-center shadow-sm transition-transform active:scale-95">
                          <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                      `
                    }
                  </div>
                </div>
              </div>
            `;
          }).join("")}

          ${dishes.length === 0 ? `
            <div class="text-center py-12 text-stone-400">
              <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 text-stone-300"></i>
              <p class="text-xs font-medium">No dishes match your search.</p>
            </div>
          ` : ''}
        </div>

        <!-- Fitted Green Footage / Footer -->
        <div class="mt-8 -mx-4 -mb-4 px-4 py-5 bg-forest text-white text-center border-t-2 border-amber-400/40 shadow-inner">
          <div class="flex items-center justify-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span class="text-xs font-black tracking-widest text-white uppercase">
              DEVELOPED BY ORIVEX TECH 2026
            </span>
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          </div>
          <p class="text-[10px] text-emerald-200/90 font-medium mt-1">Gedaa Restaurant • Digital Menu & Hospitality OS</p>
        </div>
      `;
    }

    // TAB 2: ORDER & BILL CHECKOUT SCREEN
    function renderOrderTabContent() {
      const state = window.appState;
      const cartCount = getCartCount();
      const { subtotal, serviceCharge, vat, total } = calculateBill();

      if (cartCount === 0) {
        return `
          <div class="text-center py-16 px-4">
            <div class="w-20 h-20 bg-stone-100 rounded-full flex items-center justify-center mx-auto mb-4 text-stone-400">
              <i data-lucide="shopping-bag" class="w-10 h-10"></i>
            </div>
            <h3 class="text-base font-bold text-stone-800 mb-1">${escapeHtml(t("yourCartEmpty"))}</h3>
            <p class="text-xs text-stone-500 mb-6 max-w-xs mx-auto">${escapeHtml(t("addDishPrompt"))}</p>
            <button onclick="switchTab('menu')" class="bg-forest hover:bg-forest-dark text-white text-xs font-bold px-6 py-3 rounded-xl shadow-md transition-all">
              ${escapeHtml(t("browseMenu"))}
            </button>
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between pb-2 border-b border-stone-200">
            <h2 class="text-base font-extrabold text-stone-900">${escapeHtml(t("order"))}</h2>
            <span class="text-xs font-semibold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
              ${escapeHtml(t("tableLabel"))} • ${cartCount} items
            </span>
          </div>

          <!-- Order Items List -->
          <div class="space-y-2.5">
            ${Object.entries(state.cart).map(([id, qty]) => {
              const item = state.dishes.find(m => m.id === id);
              if (!item) return '';
              const title = getItemTranslation(item, "title");
              const safeTitle = escapeHtml(title);
              const safeImage = sanitizeUrl(item.image);
              const safeId = escapeHtml(item.id);

              return `
                <div class="bg-white rounded-2xl p-3 border border-stone-200 flex items-center gap-3">
                  <img src="${safeImage}" alt="${safeTitle}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80';" class="w-14 h-14 rounded-xl object-cover">
                  <div class="flex-1 min-w-0">
                    <h4 class="font-bold text-xs text-stone-900 line-clamp-1">${safeTitle}</h4>
                    <p class="text-[11px] text-stone-500">${Number(item.price).toLocaleString()} ${escapeHtml(t("currency"))}</p>
                  </div>
                  <div class="flex items-center bg-stone-100 rounded-lg p-0.5 border border-stone-200">
                    <button onclick="removeFromCart('${safeId}')" class="w-6 h-6 flex items-center justify-center rounded-md bg-white text-stone-800 font-bold text-xs">-</button>
                    <span class="w-6 text-center text-xs font-extrabold text-stone-900">${qty}</span>
                    <button onclick="addToCart('${safeId}')" class="w-6 h-6 flex items-center justify-center rounded-md bg-forest text-white font-bold text-xs">+</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <!-- Bill Calculation Breakdown -->
          <div class="bg-white rounded-2xl p-4 border border-stone-200 space-y-2 text-xs">
            <div class="flex justify-between text-stone-600">
              <span>${escapeHtml(t("subtotal"))}</span>
              <span class="font-semibold text-stone-800">${subtotal.toLocaleString()} ${escapeHtml(t("currency"))}</span>
            </div>
            <div class="flex justify-between text-stone-600">
              <span>${escapeHtml(t("serviceCharge"))}</span>
              <span class="font-semibold text-stone-800">${serviceCharge.toLocaleString()} ${escapeHtml(t("currency"))}</span>
            </div>
            <div class="flex justify-between text-stone-600 pb-2 border-b border-stone-100">
              <span>${escapeHtml(t("vat"))}</span>
              <span class="font-semibold text-stone-800">${vat.toLocaleString()} ${escapeHtml(t("currency"))}</span>
            </div>
            <div class="flex justify-between text-stone-900 font-extrabold text-sm pt-1">
              <span>${escapeHtml(t("total"))}</span>
              <span class="text-emerald-800 text-base">${total.toLocaleString()} ${escapeHtml(t("currency"))}</span>
            </div>
          </div>

          <!-- Dine in vs Takeaway Toggle -->
          <div class="bg-stone-100 p-1 rounded-xl flex gap-1 border border-stone-200">
            <button onclick="window.appState.orderType = 'dine_in'; renderApp();" 
              class="flex-1 py-2 text-xs font-bold rounded-lg flex items-center justify-center gap-1.5 transition-all ${
                state.orderType === 'dine_in' ? 'bg-forest text-white shadow-sm' : 'text-stone-600 hover:text-stone-900'
              }">
              <i data-lucide="utensils" class="w-3.5 h-3.5"></i>
              <span>${escapeHtml(t("dineIn"))}</span>
            </button>
            <button onclick="window.appState.orderType = 'takeaway'; renderApp();" 
              class="flex-1 py-2 text-xs font-bold rounded-lg flex items-center justify-center gap-1.5 transition-all ${
                state.orderType === 'takeaway' ? 'bg-forest text-white shadow-sm' : 'text-stone-600 hover:text-stone-900'
              }">
              <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
              <span>${escapeHtml(t("takeaway"))}</span>
            </button>
          </div>

          <!-- Customer Form -->
          <div class="bg-white rounded-2xl p-4 border border-stone-200 space-y-3">
            <div>
              <input type="text" 
                value="${escapeHtml(state.customerName)}"
                maxlength="100"
                oninput="window.appState.customerName = this.value"
                placeholder="${escapeHtml(t("yourName"))}" 
                class="w-full bg-stone-50 text-stone-800 px-3 py-2 rounded-xl text-xs border border-stone-200 focus:outline-none focus:ring-1 focus:ring-forest">
            </div>
            <div>
              <input type="tel" 
                value="${escapeHtml(state.customerPhone)}"
                maxlength="30"
                oninput="window.appState.customerPhone = this.value"
                placeholder="${escapeHtml(t("phone"))}" 
                class="w-full bg-stone-50 text-stone-800 px-3 py-2 rounded-xl text-xs border border-stone-200 focus:outline-none focus:ring-1 focus:ring-forest">
            </div>

            <!-- Notes & Timing Accordion -->
            <details class="text-xs pt-1">
              <summary class="font-semibold text-stone-700 cursor-pointer flex items-center justify-between text-[11px]">
                <span>${escapeHtml(t("noteCouponTiming"))}</span>
                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-stone-400"></i>
              </summary>
              <div class="pt-2 space-y-2">
                <textarea 
                  maxlength="500"
                  oninput="window.appState.orderNotes = this.value"
                  placeholder="${escapeHtml(t("specialInstructionsPlaceholder"))}" 
                  class="w-full bg-stone-50 text-stone-800 p-2 rounded-xl text-xs border border-stone-200 focus:outline-none focus:ring-1 focus:ring-forest h-16">${escapeHtml(state.orderNotes)}</textarea>
                <input type="text" 
                  maxlength="50"
                  value="${escapeHtml(state.couponCode)}"
                  oninput="window.appState.couponCode = this.value"
                  placeholder="${escapeHtml(t("couponPlaceholder"))}" 
                  class="w-full bg-stone-50 text-stone-800 px-3 py-2 rounded-xl text-xs border border-stone-200 focus:outline-none focus:ring-1 focus:ring-forest">
              </div>
            </details>
          </div>

          <!-- Place Order Sticky Action -->
          <div class="pt-2">
            <button onclick="placeOrder()" 
              class="w-full bg-forest hover:bg-forest-dark text-white font-extrabold text-sm py-3.5 px-4 rounded-2xl shadow-xl flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
              <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
              <span>${escapeHtml(t("placeOrder"))} • ${total.toLocaleString()} ${escapeHtml(t("currency"))}</span>
            </button>
          </div>
        </div>
      `;
    }

    // TAB 3: OFFERS
    function renderOffersTabContent() {
      return `
        <div class="py-12 px-4 text-center">
          <div class="w-16 h-16 bg-amber-50 rounded-2xl flex items-center justify-center mx-auto mb-3 text-amber-600 border border-amber-100">
            <i data-lucide="ticket-percent" class="w-8 h-8"></i>
          </div>
          <h3 class="text-base font-bold text-stone-800 mb-1">${escapeHtml(t("noOffersTitle"))}</h3>
          <p class="text-xs text-stone-500 mb-6">${escapeHtml(t("noOffersDesc"))}</p>
