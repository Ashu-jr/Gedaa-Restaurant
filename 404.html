<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Gedaa Restaurant</title>
  <link rel="icon" type="image/svg+xml" href="gedaa_logo.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 min-h-screen flex items-center justify-center p-4 text-stone-900 font-sans">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 text-center shadow-xl border border-stone-200">
    <div class="w-16 h-16 rounded-2xl bg-stone-900 p-1 mx-auto mb-4 border-2 border-amber-400 shadow-md flex items-center justify-center">
      <img src="gedaa_logo.svg" alt="Gedaa Logo" class="w-full h-full object-contain">
    </div>
    <h1 class="text-3xl font-black text-stone-900 mb-2">404</h1>
    <h2 class="text-base font-extrabold text-stone-800 mb-2">Page or Resource Not Found</h2>
    <p class="text-xs text-stone-500 mb-6">The page or resource you requested is unavailable, private, or does not exist.</p>
    <div class="flex gap-3 justify-center mb-6">
      <a href="/" class="px-5 py-2.5 rounded-xl bg-emerald-900 hover:bg-emerald-950 text-white font-extrabold text-xs shadow-md transition-all">
        Back to Menu
      </a>
      <a href="/admin" class="px-5 py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-extrabold text-xs transition-all">
        Admin Portal
      </a>
    </div>

    <!-- Fitted Green Footer -->
    <div class="mt-8 -mx-8 -mb-8 py-3.5 px-4 bg-forest rounded-b-3xl text-center border-t border-emerald-800">
      <div class="flex items-center justify-center gap-1.5 text-[10px] font-black tracking-widest text-white uppercase">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
        <span>DEVELOPED BY ORIVEX TECH 2026</span>
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      </div>
    </div>
  </div>
</body>
</html>
